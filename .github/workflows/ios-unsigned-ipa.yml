name: Build iOS App (Unsigned IPA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ldid

      - name: Build the app (unsigned)
        run: .github/scripts/build-unsigned.sh

      - name: Add Entitlements
        run: .github/scripts/add-entitlements.sh

      - name: Create IPA manually
        run: .github/scripts/create-ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-App
          path: output/MASTestApp-unsigned.ipa
